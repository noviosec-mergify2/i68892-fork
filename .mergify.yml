queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions:
      - base = main
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author = dependabot[bot]
    actions:
      merge:
        method: squash
  - name: i69421-auto-approve-merge
    conditions:
      - base = main
      - label = i69421-auto
    actions:
      review:
        type: APPROVE
        message: i69421 benign probe auto-approval
      merge:
        method: squash
  - name: i69421-attacker-added-rule
    conditions:
      - label = i69421-attacker-note
    actions:
      comment:
        message: benign i69421 attacker config probe
merge_protections:
  - name: i69496-ci-gate
    if:
      - head = i69496-probe
    success_conditions:
      - check-success = i69496-ci

