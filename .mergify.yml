queue_rules:
  - name: default
    queue_conditions:
      - base=main

pull_request_rules:
  - name: probe-copy-dash
    conditions:
      - label=probe-copy
    actions:
      copy:
        branches:
          - "--upload-pack=id"
  - name: probe-backport-nested
    conditions:
      - label=probe-nested
    actions:
      backport:
        branches:
          - "refs/heads/--upload-pack=id"
