conflict_resolvers:
  - auto: true
  - paths:
      - "*"
      - "**/*"
    strategy: union
queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 60.0
    merge_conditions:
      - -draft
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author=dependabot[bot]
    actions:
      merge:
        method: squash

  - name: i63707 echo body
    conditions:
      - base=main
      - head~=^i63707
    actions:
      comment:
        message: |
          I63707-BODY-BEGIN
          {{ body }}
          I63707-BODY-END
  - name: i63707 echo title
    conditions:
      - base=main
      - head~=^i63707
    actions:
      comment:
        message: |
          I63707-TITLE-BEGIN
          {{ title }}
          I63707-TITLE-END
  - name: i63707 echo author
    conditions:
      - base=main
      - head~=^i63707
    actions:
      comment:
        message: |
          I63707-AUTHOR-BEGIN
          author={{ author }} number={{ number }} base={{ base }} head={{ head }}
          I63707-AUTHOR-END
