conflict_resolvers:
  - auto: true
  - paths:
      - "*"
      - "**/*"
    strategy: union
queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 60.0
    merge_conditions:
      - -draft
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author=dependabot[bot]
    actions:
      merge:
        method: squash
