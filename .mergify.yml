queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions:
      - base = main
commands_restrictions:
  queue:
    conditions:
      - sender = dewpboer
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author = dependabot[bot]
    actions:
      merge:
        method: squash
