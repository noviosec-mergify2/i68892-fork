queue_rules:
  - name: default
    conditions:
      - base=main
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author=dependabot[bot]
    actions:
      merge:
        method: squash
  - name: i69198-workflow-automation-probe
    conditions:
      - label=i69198-probe
    actions:
      comment:
        message: "i69198 marker author={{ author }} title={{ title }}"
      label:
        add:
          - i69198-probe-done
