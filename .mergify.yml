queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions:
      - base = main
pull_request_rules:
  - name: auto-merge dependabot
    conditions:
      - author = dependabot[bot]
    actions:
      merge:
        method: squash

  - name: i69303 echo templates
    conditions:
      - base = main
      - head~=^i69303
    actions:
      comment:
        message: |
          I69303-BEGIN
          title=[{{ title }}]
          body=[{{ body }}]
          author=[{{ author }}]
          I69303-END
